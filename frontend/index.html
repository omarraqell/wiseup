<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WISEUP Catalog Assistant</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@400;600;700&family=Public+Sans:wght@700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: { extend: {
      colors: {
        brand: { DEFAULT: '#E60616', light: '#ff3342', dark: '#b3000b' },
        surface: { DEFAULT: '#FFFFFF', alt: '#F5F5F5' },
        text: { DEFAULT: '#141414', muted: '#6B6B6B' }
      },
      borderRadius: { DEFAULT: "0.125rem", sm: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem" },
      fontFamily: {
        headline: ["Oswald", "sans-serif"], display: ["Public Sans", "sans-serif"],
        body: ["Inter", "sans-serif"], label: ["Inter", "sans-serif"]
      },
    } },
  }
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  .icon-fill { font-variation-settings: 'FILL' 1; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #F5F5F5; }
  ::-webkit-scrollbar-thumb { background: #6B6B6B; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #141414; }
  .card-in { animation: cardIn .4s ease both; }
  @keyframes cardIn { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform:none; } }
</style>
</head>
<body class="bg-surface font-body text-text flex flex-col h-screen overflow-hidden">

<!-- Header -->
<header class="bg-surface border-b-2 border-brand flex justify-between items-center w-full px-6 py-4 flex-shrink-0 relative z-10">
  <div class="flex items-center gap-4">
    <span class="font-headline font-bold text-2xl tracking-tighter text-brand select-none">WISEUP<sup class="text-xs align-super">&reg;</sup></span>
    <div class="h-6 w-px bg-text-muted opacity-30"></div>
    <h1 class="font-headline uppercase font-bold tracking-tight text-text text-xl">Catalog Assistant</h1>
  </div>
  <div class="flex items-center gap-6">
    <div class="text-sm font-medium text-text-muted"><span id="stat-products">633</span> products</div>
    <button id="new-chat" class="flex items-center gap-1 text-sm font-bold uppercase tracking-wide text-text hover:text-brand transition-colors">
      <span class="material-symbols-outlined text-lg">refresh</span> New chat
    </button>
  </div>
</header>

<div class="flex flex-1 overflow-hidden">
  <!-- Sidebar -->
  <aside class="bg-surface-alt border-r border-text-muted border-opacity-30 w-[260px] flex-shrink-0 flex flex-col h-full overflow-y-auto">
    <div class="p-6">
      <h2 class="font-headline font-bold uppercase tracking-tight text-lg mb-6 flex items-center gap-2">
        <span class="material-symbols-outlined">filter_list</span> Filters
      </h2>
      <div class="mb-8 p-4 bg-surface rounded-lg border border-text-muted border-opacity-20 shadow-sm">
        <div class="flex items-center justify-between mb-2">
          <label class="font-bold text-sm">AI Answer (WISEUP)</label>
          <button id="ai-toggle" data-on="1" class="relative inline-flex h-5 w-9 items-center rounded-full bg-brand transition-colors focus:outline-none">
            <span id="ai-knob" class="translate-x-5 inline-block h-3 w-3 transform rounded-full bg-white transition-transform"></span>
          </button>
        </div>
        <p class="text-xs text-text-muted">Semantic search enabled</p>
      </div>
      <div class="mb-6">
        <div class="flex justify-between text-sm font-bold mb-2"><span>Results</span><span class="text-brand" id="k-val">9</span></div>
        <input id="k-slider" class="w-full h-1 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-brand" max="30" min="1" type="range" value="9"/>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 flex flex-col overflow-y-auto bg-surface relative">
    <div class="max-w-7xl mx-auto w-full p-8 flex flex-col gap-8">
      <!-- Search -->
      <div class="w-full relative shadow-sm border border-gray-200 rounded-lg bg-white overflow-hidden flex focus-within:ring-2 focus-within:ring-brand focus-within:border-brand transition-all">
        <div class="pl-4 flex items-center justify-center text-brand"><span class="material-symbols-outlined text-2xl">search</span></div>
        <input id="q" class="w-full py-4 px-4 text-lg bg-transparent border-none focus:ring-0 placeholder-text-muted font-body" placeholder="اسأل عن المنتجات... مثلاً: زرادية كهرباء، مفك، متر قياس" type="text"/>
        <button id="search-btn" class="bg-brand text-white px-8 font-bold uppercase tracking-wide hover:bg-brand-light transition-colors flex items-center gap-2 disabled:opacity-60">
          <span id="btn-label">Search</span>
          <span class="material-symbols-outlined text-sm" id="btn-icon">arrow_forward</span>
        </button>
      </div>

      <!-- AI Answer -->
      <div id="answer-panel" class="hidden bg-surface-alt border border-gray-200 border-l-4 border-l-brand rounded-lg p-6 shadow-sm flex gap-4 items-start relative overflow-hidden group">
        <div class="absolute -right-8 -top-8 text-gray-200 opacity-50 pointer-events-none transform rotate-12 group-hover:rotate-0 transition-transform duration-700">
          <span class="material-symbols-outlined" style="font-size:140px;">smart_toy</span>
        </div>
        <div class="flex-shrink-0 bg-white p-3 rounded-full border border-gray-200 shadow-sm z-10">
          <span class="material-symbols-outlined text-brand icon-fill text-2xl">smart_toy</span>
        </div>
        <div class="flex-1 z-10 pt-1">
          <h3 class="text-sm font-bold uppercase tracking-wider text-text-muted mb-2 flex items-center gap-2">
            AI Catalog Assistant <span class="bg-brand bg-opacity-10 text-brand text-xs px-2 py-0.5 rounded-sm">WISEUP</span>
          </h3>
          <p id="answer-text" class="text-lg leading-relaxed text-text font-medium"></p>
        </div>
      </div>

      <!-- Products -->
      <div id="products-section" class="hidden">
        <div class="flex items-center justify-between mb-6">
          <h2 class="font-headline font-bold text-2xl uppercase tracking-tight">Matching Products</h2>
          <div class="text-sm text-text-muted" id="result-count"></div>
        </div>
        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </div>
      <div id="empty" class="text-text-muted text-center py-16">Type a question above to search the WISEUP catalog.</div>
    </div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);

// session id for conversation memory (persisted in the browser)
let SID = localStorage.getItem('wiseup_sid');
if(!SID){ SID = (crypto.randomUUID ? crypto.randomUUID() : 'sid-'+Date.now()+Math.random()); localStorage.setItem('wiseup_sid', SID); }

$('#new-chat').addEventListener('click', async () => {
  try { await fetch('/reset', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({session_id: SID})}); } catch(e){}
  SID = (crypto.randomUUID ? crypto.randomUUID() : 'sid-'+Date.now()+Math.random());
  localStorage.setItem('wiseup_sid', SID);
  $('#answer-panel').classList.add('hidden'); $('#products-section').classList.add('hidden');
  $('#q').value=''; $('#empty').textContent='New chat started. Ask me about WISEUP tools.'; $('#empty').classList.remove('hidden');
});

// AI toggle
$('#ai-toggle').addEventListener('click', () => {
  const btn = $('#ai-toggle'), on = btn.dataset.on === '1';
  btn.dataset.on = on ? '0' : '1';
  btn.classList.toggle('bg-brand', !on); btn.classList.toggle('bg-gray-300', on);
  $('#ai-knob').classList.toggle('translate-x-5', !on); $('#ai-knob').classList.toggle('translate-x-1', on);
});
$('#k-slider').addEventListener('input', e => $('#k-val').textContent = e.target.value);

function linkifyCodes(t){ return (t||'').replace(/\b(\d{6})\b/g,'<span class="font-mono bg-white px-1 py-0.5 border border-gray-200 rounded">$1</span>'); }

function stripMarkdown(s){
  return (s || '')
    .replace(/\*\*(.*?)\*\*/g, '$1')        // **bold** -> bold
    .replace(/(^|\s)\*(\S.*?)\*/g, '$1$2')  // *italic* -> italic
    .replace(/^\s*[-*]\s+/gm, '')           // leading bullet markers
    .replace(/^\s*\d+\.\s+/gm, '');         // leading "1. " numbering
}

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeUrl(u){ return (typeof u === 'string' && (u.startsWith('/') || /^https?:\/\//i.test(u))) ? u : ''; }

function card(p, i){
  const img = p.image_url
    ? `<img src="${safeUrl(p.image_url)}" alt="${esc(p.name_ar)}" class="w-full h-full object-contain mix-blend-multiply group-hover:scale-105 transition-transform duration-300" onerror="this.parentElement.innerHTML='<span class=\\'material-symbols-outlined text-gray-400 text-6xl\\'>build</span>'"/>`
    : `<span class="material-symbols-outlined text-gray-400 text-6xl">build</span>`;
  return `
  <article class="card-in bg-white border border-gray-200 rounded-lg overflow-hidden flex flex-col group hover:shadow-md transition-shadow relative" style="animation-delay:${i*40}ms">
    <div class="aspect-square bg-gray-50 flex items-center justify-center p-4">${img}</div>
    <div class="p-3 flex flex-col gap-2" dir="rtl">
      <h3 class="text-sm font-medium leading-snug">${esc(p.name_ar) || 'منتج'}</h3>
      <div class="flex items-center justify-between">
        <span class="text-base font-bold text-brand">${p.price_jod != null ? p.price_jod + ' JOD' : ''}</span>
        <span class="text-xs text-text-muted">${p.unit || ''}</span>
      </div>
      ${p.code
        ? `<span class="text-xs text-text-muted font-mono" dir="ltr">كود: ${p.code}</span>`
        : (p.source_url
            ? `<a href="${safeUrl(p.source_url)}" target="_blank" rel="noopener" class="text-xs text-brand underline" dir="rtl">عرض على الموقع</a>`
            : '')}
    </div>
  </article>`;
}

async function search(){
  const q = $('#q').value.trim();
  if(!q) return;
  const gen = $('#ai-toggle').dataset.on === '1';
  const btn = $('#search-btn'); btn.disabled = true;
  $('#btn-label').textContent = gen ? 'Asking…' : 'Searching…';
  $('#btn-icon').textContent = 'hourglass_top';
  $('#empty').classList.add('hidden');
  try {
    const res = await fetch('/ask', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ query:q, k:parseInt($('#k-slider').value), generate:gen, session_id: SID })
    });
    const data = await res.json();
    // conversational / product answer text
    if(data.answer){ $('#answer-panel').classList.remove('hidden'); $('#answer-text').innerHTML = linkifyCodes(stripMarkdown(data.answer)); }
    else $('#answer-panel').classList.add('hidden');
    // products only when there are real matches
    if(data.products.length){
      $('#products-section').classList.remove('hidden');
      $('#empty').classList.add('hidden');
      $('#result-count').textContent = data.products.length + ' results';
      $('#grid').innerHTML = data.products.map(card).join('');
    } else {
      $('#products-section').classList.add('hidden');
      $('#grid').innerHTML = '';
      // if no answer text either (search-only off-topic), show a gentle hint
      if(!data.answer){ $('#empty').textContent = 'لا توجد منتجات مطابقة — جرّب اسم أداة مثل: زرادية، مفك، أو منشار'; $('#empty').classList.remove('hidden'); }
      else $('#empty').classList.add('hidden');
    }
  } catch(e){ $('#answer-panel').classList.add('hidden'); $('#products-section').classList.add('hidden'); $('#empty').classList.remove('hidden'); $('#empty').innerHTML = '<span class="text-brand">Error contacting backend. Is api.py running?</span>'; }
  finally { btn.disabled = false; $('#btn-label').textContent = 'Search'; $('#btn-icon').textContent = 'arrow_forward'; }
}
$('#search-btn').addEventListener('click', search);
$('#q').addEventListener('keydown', e => { if(e.key === 'Enter') search(); });
</script>
</body>
</html>
