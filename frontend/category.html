<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased rtl">

<!-- Desktop Navigation -->
<nav class="hidden md:flex gap-gutter items-center">
<a class="font-headline-sm md:font-headline-md text-on-surface-variant dark:text-on-secondary-fixed-variant hover:text-brand-red dark:hover:text-primary-fixed transition-colors scale-95 active:opacity-80 transition-all" href="/catalog">المتجر</a>
<a class="font-headline-sm md:font-headline-md text-brand-red dark:text-primary-fixed font-bold border-b-2 border-brand-red hover:text-brand-red dark:hover:text-primary-fixed transition-colors scale-95 active:opacity-80 transition-all" href="#">الأدوات اليدوية</a>
<a class="font-headline-sm md:font-headline-md text-on-surface-variant dark:text-on-secondary-fixed-variant hover:text-brand-red dark:hover:text-primary-fixed transition-colors scale-95 active:opacity-80 transition-all" href="#">المجموعات</a>
<a class="font-headline-sm md:font-headline-md text-on-surface-variant dark:text-on-secondary-fixed-variant hover:text-brand-red dark:hover:text-primary-fixed transition-colors scale-95 active:opacity-80 transition-all" href="#">العروض</a>
<a class="font-headline-sm md:font-headline-md text-on-surface-variant dark:text-on-secondary-fixed-variant hover:text-brand-red dark:hover:text-primary-fixed transition-colors scale-95 active:opacity-80 transition-all" href="#">من نحن</a>
</nav>
<!-- Trailing Actions -->
<div class="flex gap-stack-sm items-center">
<button class="p-2 text-primary dark:text-primary-fixed hover:bg-surface-subtle rounded-DEFAULT transition-colors">
<span class="material-symbols-outlined">shopping_cart</span>
</button>
<button class="p-2 text-primary dark:text-primary-fixed hover:bg-surface-subtle rounded-DEFAULT transition-colors">
<span class="material-symbols-outlined">language</span>
</button>
<button class="md:hidden p-2 text-primary dark:text-primary-fixed hover:bg-surface-subtle rounded-DEFAULT transition-colors">
<span class="material-symbols-outlined">menu</span>
</button>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow w-full px-margin-page max-w-7xl mx-auto py-stack-lg">
<!-- Category Header -->
<div class="mb-stack-lg border-b border-border-light pb-stack-sm flex justify-between items-end">
<h1 class="font-headline-xl text-on-surface" id="category-name"></h1>
<span class="font-body-md text-on-surface-variant"><span id="product-count"></span> منتج</span>
</div>
<!-- Product Grid -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-gutter" id="product-grid"></div>
</main>
<!-- Footer -->
<footer class="bg-on-secondary-fixed dark:bg-on-background text-surface-bright dark:text-surface-container-low font-body-sm full-width border-t border-outline dark:border-outline-variant mt-auto">
<div class="w-full py-stack-lg px-margin-page grid grid-cols-1 md:grid-cols-4 gap-gutter text-right rtl max-w-7xl mx-auto">
<div class="col-span-1 md:col-span-1">
<div class="font-headline-md text-headline-md text-surface-bright mb-stack-sm">WISEUP</div>
<p class="opacity-90 hover:opacity-100 transition-opacity text-secondary-fixed dark:text-secondary-fixed-dim">© 2024 WISEUP. جميع الحقوق محفوظة.</p>
</div>
<div class="col-span-1 md:col-span-3 grid grid-cols-2 md:grid-cols-4 gap-gutter mt-stack-md md:mt-0">
<a class="text-secondary-fixed dark:text-secondary-fixed-dim hover:text-brand-red transition-colors opacity-90 hover:opacity-100 block" href="#">الخصوصية</a>
<a class="text-secondary-fixed dark:text-secondary-fixed-dim hover:text-brand-red transition-colors opacity-90 hover:opacity-100 block" href="#">الشروط والأحكام</a>
<a class="text-secondary-fixed dark:text-secondary-fixed-dim hover:text-brand-red transition-colors opacity-90 hover:opacity-100 block" href="#">سياسة التوصيل</a>
<a class="text-secondary-fixed dark:text-secondary-fixed-dim hover:text-brand-red transition-colors opacity-90 hover:opacity-100 block" href="#">تواصل معنا</a>
</div>
</div>
</footer>
<script src="/static/store.js"></script>
<script>
  WISEUP.applyDir();
  const id = Number(new URLSearchParams(location.search).get("id"));
  const grid = document.getElementById("product-grid");
  const heading = document.getElementById("category-name");
  const count = document.getElementById("product-count");

  (async () => {
    const { categories } = await WISEUP.getJSON("/api/categories");
    const cat = categories.find((c) => c.id === id);
    if (!cat) {
      heading.textContent = WISEUP.lang() === "en" ? "Category not found" : "الفئة غير موجودة";
      return;
    }
    heading.textContent = WISEUP.lang() === "en" ? cat.name_en : cat.name_ar;
    const { products } = await WISEUP.getJSON(`/api/products?category_id=${id}`);
    count.textContent = products.length;
    grid.innerHTML = products.map(WISEUP.productCard).join("");
  })();
</script>
