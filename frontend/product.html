<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            theme: {

                    "colors": {
                        "tertiary": "#005aa7",

                        "inverse-surface": "#412b28",
                        "tertiary-fixed-dim": "#a5c8ff",
                        "surface-container-highest": "#ffdad6",
                        "error": "#ba1a1a",

                        "secondary-fixed-dim": "#c8c6c5",
                        "primary-fixed-dim": "#ffb4aa",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#004786",
                        "on-primary-fixed": "#410001",
                        "outline-variant": "#e9bcb6",
                        "surface-subtle": "#F5F5F5",
                        "on-primary-container": "#fff8f7",
                        "border-light": "#E5E5E5",
                        "on-surface-variant": "#5e3f3b",
                        "surface-tint": "#c0000f",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#ffe9e6",
                        "brand-red": "#E60616",
                        "brand": "#E60616",
                        "primary-fixed": "#ffdad5",
                        "on-background": "#2a1614",
                        "secondary": "#5f5e5e",
                        "on-surface": "#2a1614",
                        "on-error": "#ffffff",
                        "on-secondary-fixed-variant": "#474746",
                        "surface": "#fff8f7",
                        "surface-container-high": "#ffe2de",
                        "inverse-primary": "#ffb4aa",
                        "surface-bright": "#fff8f7",
                        "surface-container-low": "#fff0ee",
                        "secondary-fixed": "#e5e2e1",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-variant": "#ffdad6",
                        "outline": "#936e69",
                        "on-secondary-container": "#636262",
                        "on-primary": "#ffffff",
                        "primary": "#b8000e",
                        "surface-dim": "#f6d2cd",
                        "secondary-container": "#e2dfde",
                        "primary-container": "#e60616",
                        "tertiary-container": "#0073d2",
                        "on-tertiary-container": "#f8f8ff",
                        "on-primary-fixed-variant": "#930008",
                        "tertiary-fixed": "#d4e3ff",

                        "on-tertiary-fixed": "#001c3a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {

                        "gutter": "16px",

                        "stack-sm": "8px"

                    "fontFamily": {

                        "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-xl": ["48px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "button": ["16px", { "lineHeight": "1", "fontWeight": "600" }]

                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopNavBar Component -->
<header class="bg-surface border-b border-border-light w-full">
<div class="flex flex-row-reverse justify-between items-center w-full px-margin-page max-w-7xl mx-auto h-20">
<div class="flex items-center gap-4 flex-row-reverse">
<a class="font-headline-lg text-brand-red" href="/">WISEUP</a>
</div>
<nav class="hidden md:flex flex-row-reverse gap-8 items-center">
<a class="text-on-surface-variant hover:text-brand-red transition-colors font-headline-sm scale-95 active:opacity-80" href="/catalog">المتجر</a>
</nav>
<div class="flex items-center gap-4 flex-row-reverse">
<button class="text-on-surface-variant hover:text-brand-red transition-colors scale-95 active:opacity-80">
<span class="material-symbols-outlined">shopping_cart</span>
</button>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow w-full max-w-7xl mx-auto px-margin-page py-stack-lg">
<!-- Breadcrumbs -->
<div class="flex items-center gap-2 mb-stack-md text-on-surface-variant font-body-sm">
<a class="hover:text-brand-red transition-colors" href="/">الرئيسية</a>
<span class="material-symbols-outlined text-sm">chevron_left</span>
<a class="hover:text-brand-red transition-colors" href="/catalog">المتجر</a>
</div>
<!-- Product Section (filled by script) -->
<div id="product-root" class="mb-stack-lg"></div>
<!-- Related Products -->
<div>
<h3 class="font-headline-md text-on-surface mb-stack-md">منتجات ذات صلة</h3>
<div class="grid grid-cols-2 md:grid-cols-4 gap-gutter" id="related-grid"></div>
</div>
</main>
<!-- Footer Component -->
<footer class="bg-on-secondary-fixed w-full mt-auto border-t border-outline">
<div class="w-full py-stack-lg px-margin-page grid grid-cols-1 md:grid-cols-4 gap-gutter text-right rtl max-w-7xl mx-auto">
<div class="flex flex-col gap-4">
<span class="font-headline-md text-surface-bright">WISEUP</span>
<span class="font-body-sm text-secondary-fixed">© 2024 WISEUP. جميع الحقوق محفوظة.</span>
</div>
<div class="flex flex-col gap-2">
<a class="font-body-sm text-secondary-fixed hover:text-brand-red transition-colors opacity-90 hover:opacity-100" href="#">الخصوصية</a>
</div>
<div class="flex flex-col gap-2">
<a class="font-body-sm text-secondary-fixed hover:text-brand-red transition-colors opacity-90 hover:opacity-100" href="#">الشروط والأحكام</a>
</div>
<div class="flex flex-col gap-2">
<a class="font-body-sm text-secondary-fixed hover:text-brand-red transition-colors opacity-90 hover:opacity-100" href="#">سياسة التوصيل</a>
<a class="font-body-sm text-secondary-fixed hover:text-brand-red transition-colors opacity-90 hover:opacity-100" href="#">تواصل معنا</a>
</div>
</div>
</footer>
<script src="/static/store.js"></script>
<script>
  WISEUP.applyDir();
  const code = new URLSearchParams(location.search).get("code");
  const root = document.getElementById("product-root");
  const related = document.getElementById("related-grid");

  (async () => {
    let p;
    try {
      p = await WISEUP.getJSON(`/api/products/${encodeURIComponent(code)}`);
    } catch (e) {
      root.innerHTML = `<p class="text-center text-gray-500 py-16">${
        WISEUP.lang() === "en" ? "Product not found" : "المنتج غير موجود"}</p>`;
      return;
    }
    const price = WISEUP.money(p);
    document.title = `${WISEUP.t(p)} — WISEUP`;
    root.innerHTML = `
      <div class="grid md:grid-cols-2 gap-8">
        <img src="${WISEUP.esc(p.image_url)}" alt="${WISEUP.esc(WISEUP.t(p))}"
             class="w-full object-contain bg-white rounded border p-6"
             onerror="this.style.visibility='hidden'">
        <div>
          <h1 class="font-headline text-3xl mb-2">${WISEUP.esc(WISEUP.t(p))}</h1>
          <p class="text-gray-500 mb-4">${WISEUP.esc(p.name_en)} · ${WISEUP.esc(p.name_ar)}</p>
          <dl class="text-sm space-y-1 mb-6">
            <div><dt class="inline text-gray-500">${
              WISEUP.lang() === "en" ? "Code" : "الكود"}:</dt>
                <dd class="inline font-mono">${WISEUP.esc(p.code)}</dd></div>
            <div><dt class="inline text-gray-500">${
              WISEUP.lang() === "en" ? "Unit" : "الوحدة"}:</dt>
                <dd class="inline">${WISEUP.esc(p.unit)}</dd></div>
          </dl>
          ${price ? `<div class="text-brand font-bold text-3xl mb-6">${
            WISEUP.esc(price)}</div>` : ""}
          <div class="flex gap-3 items-center">
            <input id="qty" type="number" min="1" value="1"
                   class="w-20 border rounded px-3 py-2">
            <button id="add" class="bg-brand text-white px-6 py-2 rounded font-semibold">
              ${WISEUP.lang() === "en" ? "Add to cart" : "أضف إلى السلة"}
            </button>
          </div>
        </div>
      </div>`;
    // Phase 4 owns the cart. Until then the button is honest about doing nothing.
    document.getElementById("add").addEventListener("click", () => {
      alert(WISEUP.lang() === "en"
        ? "Ordering opens soon — call us to place an order."
        : "الطلب سيتوفر قريباً — اتصل بنا لإتمام الطلب.");
    });
    const { products } = await WISEUP.getJSON(`/api/products?category_id=${p.category_id}`);
    related.innerHTML = products.filter((x) => x.code !== p.code)
      .slice(0, 6).map(WISEUP.productCard).join("");
  })();
</script>
</body></html>
